function nav(back,next,nextLabel,disabled=false){return `<div class="nav"><button onclick="go(${back})">${t('back')}</button>${next===null?'':`<button class="primary" ${disabled?'disabled':''} onclick="go(${next})">${t(nextLabel)}</button>`}</div>`}
function evidenceTable(id){const xs=[...records[id]].sort((a,b)=>a-b);return `<div class="tablewrap"><table><thead><tr><th>${t('input')} (x)</th><th>${t('output')} (y)</th></tr></thead><tbody>${xs.map(x=>`<tr><td>${x}</td><td>${F[id](x)}</td></tr>`).join('')||`<tr><td colspan="2">${t('none')}</td></tr>`}</tbody></table></div>`}
function graph(id,xs,connect=false){const X=x=>34+x*30,Y=y=>230-y*2.75;let grid='';for(let x=0;x<=8;x+=2)grid+=`<line x1="${X(x)}" y1="20" x2="${X(x)}" y2="230" stroke="#344360"/><text x="${X(x)}" y="247" text-anchor="middle">${x}</text>`;for(let y=0;y<=70;y+=10)grid+=`<line x1="34" y1="${Y(y)}" x2="274" y2="${Y(y)}" stroke="#344360"/><text x="28" y="${Y(y)+4}" text-anchor="end">${y}</text>`;return `<svg class="graph" viewBox="0 0 300 265" role="img" aria-label="${t('graph')} ${id}"><line x1="34" y1="20" x2="34" y2="230" stroke="#9cacc9"/><line x1="34" y1="230" x2="280" y2="230" stroke="#9cacc9"/>${grid}${connect?`<polyline points="${xs.map(x=>`${X(x)},${Y(F[id](x))}`).join(' ')}" fill="none" stroke="#ffd277" stroke-width="3"/>`:''}${xs.map(x=>`<circle cx="${X(x)}" cy="${Y(F[id](x))}" r="5" fill="#8ce5c6" stroke="#162039" stroke-width="2"/>`).join('')}<text x="282" y="244">x</text><text x="12" y="16">y</text></svg>`}
function machine(id){return `<div class="machine"><div class="machineName">${t('machine')} ${id}</div><div class="machineBody"><div class="value" id="input${id}">${current[id]}</div><div class="arrow">➜</div><div class="mystery">⚙️ ?</div><div class="arrow">➜</div><div class="value" id="output${id}">${F[id](current[id])}</div></div><div class="controls"><span>${t('input')}</span><input aria-label="${t('machine')} ${id} ${t('input')}" type="range" min="0" max="8" step="1" value="${current[id]}" oninput="move('${id}',+this.value)"><span id="range${id}">${current[id]}</span></div></div>`}
function move(id,x){current[id]=x;$('input'+id).textContent=x;$('output'+id).textContent=F[id](x);$('range'+id).textContent=x}
function record(id){records[id].add(current[id]);render()}
function resetMachine(id){records[id].clear();render()}

const animalPairs=[{adult:'🐈',baby:'🐱',name:'cat',babyName:'kitten'},{adult:'🐕',baby:'🐶',name:'dog',babyName:'puppy'},{adult:'🐄',baby:'🐮',name:'cow',babyName:'calf'}];
let animalIndex=0;
function chooseAnimal(i){if(animalBusy)return;animalIndex=i;animalPick='';animalResult='';render()}
function chooseBaby(i){if(animalBusy)return;animalPick=String(i);animalResult='';render()}
function runAnimal(){if(animalBusy||animalPick==='')return;const ok=Number(animalPick)===animalIndex;animalBusy=true;const incoming=$('animalIncoming'),machineEl=$('animalMachine'),outgoing=$('animalOutgoing');incoming?.classList.add('travel-in');machineEl?.classList.add('working');setTimeout(()=>{if(outgoing){outgoing.textContent=animalPairs[animalIndex].baby;outgoing.classList.add('travel-out')}animalResult=ok?'right':'retry';if(ok)animalDone.add(animalIndex);animalBusy=false;const msg=$('animalMsg');if(msg)msg.textContent=t(ok?'animalYes':'animalTry');const btn=$('animalNext');if(btn)btn.disabled=animalDone.size<2;},1150)}
function animalStage(){const a=animalPairs[animalIndex];return `<div class="card"><h2>${t('animalTitle')}</h2><p>${t('animalIntro')}</p><div class="animal-tabs">${animalPairs.map((p,i)=>`<button class="${animalIndex===i?'primary':''}" onclick="chooseAnimal(${i})">${p.adult} ${t('animalCase')} ${i+1} ${animalDone.has(i)?'✓':''}</button>`).join('')}</div><div class="animal-belt" aria-label="${t('animalTitle')}"><div id="animalIncoming" class="animal-icon">${a.adult}</div><div id="animalMachine" class="animal-box">⚙️<div>?</div></div><div id="animalOutgoing" class="animal-icon">${animalResult==='right'?a.baby:'❔'}</div></div><h3>${t('animalQuestion')}</h3><div class="animal-choices">${animalPairs.map((p,i)=>`<button class="${animalPick===String(i)?'primary':''}" onclick="chooseBaby(${i})">${p.baby} ${t('animalBaby'+i)}</button>`).join('')}</div><div class="row"><button onclick="runAnimal()" ${animalPick===''?'disabled':''}>${t('animalRun')}</button><button onclick="chooseAnimal(${animalIndex})">${t('animalReplay')}</button></div><p id="animalMsg" class="statusline" aria-live="polite">${animalResult==='right'?t('animalYes'):animalResult==='retry'?t('animalTry'):''}</p><div class="note">${t('animalConcept')}</div><p class="small">${t('animalProgress')}: ${animalDone.size}/2</p><div class="nav"><button onclick="go(-1)">${t('back')}</button><button class="primary" id="animalNext" onclick="go(1)" ${animalDone.size<2?'disabled':''}>${t('animalContinue')}</button></div></div>`}
function deltaTable(id){const xs=[0,1,2,3];return `<div class="tablewrap"><table><thead><tr><th>x</th>${xs.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><th>y</th>${xs.map(x=>`<td>${F[id](x)}</td>`).join('')}</tr><tr class="delta"><th>${t('changes')}</th><td>—</td>${xs.slice(1).map((x,i)=>`<td><span class="delta-pill">+${F[id](x)-F[id](x-1)}</span></td>`).join('')}</tr></tbody></table></div>`}
function guideChoice(){return `<div class="guide"><h3>${t('guideTitle')}</h3><p>${t('guideGraph')}</p><div class="animal-choices"><label class="choice"><input type="radio" name="shape" value="A" onchange="guideShape=this.value"> ${t('shapeA')}</label><label class="choice"><input type="radio" name="shape" value="B" onchange="guideShape=this.value"> ${t('shapeB')}</label></div><p>${t('guideArrows')}</p><p>${t('guideSentence')}</p><div class="note">${t('guideFrame')}</div></div>`}
function sentenceBuilder(){const es=lang==='es';const sets=[
{label:es?'Máquina':'Machine',opts:[['',es?'Elige':'Choose'],['A','A'],['B','B']]},
{label:es?'Forma de la gráfica':'Graph shape',opts:[['',es?'Elige':'Choose'],['curves',es?'es curva':'curves'],['straight',es?'es una línea recta':'is a straight line']]},
{label:es?'Cambios en la tabla':'Table changes',opts:[['',es?'Elige':'Choose'],['different',es?'son diferentes':'are different'],['same',es?'son iguales':'are the same']]},
{label:es?'Otra máquina':'Other machine',opts:[['',es?'Elige':'Choose'],['A','A'],['B','B']]},
{label:es?'Cambio de salida':'Output change',opts:[['',es?'Elige':'Choose'],['one',es?'en 1':'by 1'],['varies',es?'en cantidades diferentes':'by different amounts']]}];return `<div class="guide"><h3>${es?'Construye tu explicación':'Build your explanation'}</h3><p>${es?'Elige una opción en cada menú. Luego envía tu oración al cuadro de respuesta y puedes editarla.':'Choose an option in each menu. Then send your sentence to the response box, where you can edit it.'}</p><div class="sentence-builder">${sets.map((set,i)=>`<label>${set.label}<select id="sentence${i}" aria-label="${set.label}">${set.opts.map(([v,label])=>`<option value="${v}">${label}</option>`).join('')}</select></label>`).join('')}</div><button type="button" onclick="applySentence()">${es?'Usar mi oración ↓':'Use my sentence ↓'}</button><p id="sentenceStatus" class="small" aria-live="polite"></p></div>`}
function applySentence(){const v=Array.from({length:5},(_,i)=>$('sentence'+i).value);if(v.some(x=>!x)){$('sentenceStatus').textContent=lang==='es'?'Completa los cinco menús primero.':'Choose an option in all five menus first.';return}const [machine,shape,changes,other,rate]=v;const es=lang==='es';const statement=es?`La máquina ${machine} es la impostora porque su gráfica ${shape==='curves'?'es curva':'es una línea recta'}. En su tabla, los cambios ${changes==='different'?'son diferentes':'son iguales'}, pero la máquina ${other} cambia ${rate==='one'?'en 1':'en cantidades diferentes'} cada vez.`:`Machine ${machine} is the impostor because its graph ${shape==='curves'?'curves':'is a straight line'}. In its table, the changes ${changes==='different'?'are different':'are the same'}, but Machine ${other} changes ${rate==='one'?'by 1':'by different amounts'} each time.`;$('reason').value=statement;reason=statement;$('sentenceStatus').textContent=es?'Oración añadida. Puedes editarla abajo.':'Sentence added. You can edit it below.'}
let guideShape='';
function render(){document.documentElement.lang=lang;$('subtitle').textContent=t('subtitle');$('stagePill').textContent=stage<0?'EN / ES':`${t('stage')} ${stage} ${t('of')} 5`;$('footer').textContent=t('footer');$('progress').innerHTML=Array.from({length:5},(_,i)=>`<div class="dot ${stage>i?'on':''}"></div>`).join('');let h='';
if(stage===-1)h=`<div class="card"><h2>${t('choose')}</h2><p>Choose English or Español. / Elige inglés o español.</p><div class="langchoices"><button class="primary" onclick="selectLanguage('en')">English →</button><button class="primary" onclick="selectLanguage('es')">Español →</button></div></div>`;
if(stage===0)h=animalStage();
if(stage===1||stage===2){const id=stage===1?'A':'B';const xs=[...records[id]].sort((a,b)=>a-b);h=`<div class="card"><h2>${t(stage===1?'investigateA':'investigateB')}</h2><p class="sub">${t(stage===1?'introA':'introB')}</p>${machine(id)}<div class="row"><button onclick="record('${id}')">${t('record')}</button><button onclick="resetMachine('${id}')">${t('clear')}</button><span class="status">${xs.length} ${t('unique')}</span></div><div class="cols"><div><h3>${t('table')}</h3>${evidenceTable(id)}</div><div><h3>${t('graph')}</h3>${graph(id,xs)}</div></div><div class="note">${t(stage===1?'noteA':'noteB')}</div>${xs.length<4?`<p class="headnote">${t('needFour')}</p>`:''}${nav(stage-1,stage+1,stage===1?'nextB':'nextPred',xs.length<4)}</div>`}
if(stage===3){h=`<div class="card"><h2>${t('prediction')}</h2><p>${t('predictionIntro')}</p><div class="evidence"><h3>${t('recordedEvidence')}</h3><div class="evidence-grid">${['A','B'].map(id=>`<div><div class="sectionlabel">${t('machine')} ${id}</div>${evidenceTable(id)}</div>`).join('')}</div></div><div class="predict">${predInputs.map(([id,x],i)=>`<div class="prompt"><strong>${t('machine')} ${id}</strong><div>${t('input')}: ${x} → ${t('output')}: ?</div><label for="p${i}" class="small">${t('yourPrediction')}</label><input id="p${i}" type="number" value="${esc(preds[i])}" placeholder="${t('yourPrediction')}" aria-label="${t('machine')} ${id} ${t('input')} ${x}" oninput="predictionEdited(${i})"><div class="pred-mark" id="mark${i}" aria-live="polite"></div></div>`).join('')}</div><p class="small">${t('practice')}</p><button onclick="checkPredictions()">${t('checkPred')}</button><div class="feedback" id="predictionFeedback" aria-live="polite"></div><div id="predictionDetails">${predRevealed?`<p class="small">${t('revisePrompt')}</p>`+predictionResult():''}</div>${nav(2,predRevealed?4:null,'compare')}</div>`}
if(stage===4){h=`<div class="card"><h2>${t('investigation')}</h2><p>${t('investigationIntro')}</p><p>${t('linearInfo')}</p><div class="compare">${['A','B'].map(id=>`<div class="card"><h3>${t('machine')} ${id}</h3>${deltaTable(id)}${graph(id,Array.from({length:9},(_,i)=>i),true)}</div>`).join('')}</div>${guideChoice()}${sentenceBuilder()}<fieldset><legend><strong>${t('impostor')}</strong></legend>${['A','B'].map(id=>`<label class="choice"><input type="radio" name="suspect" value="${id}" ${claim===id?'checked':''}> ${t('machine')} ${id}</label>`).join('')}</fieldset><label for="reason"><strong>${t('reason')}</strong></label><textarea id="reason" placeholder="${t('reasonPlace')}">${esc(reason)}</textarea><div class="row"><button onclick="checkClaim()">${t('submit')}</button><span id="claimFeedback" class="feedback" aria-live="polite">${claimSolved?t('solved'):''}</span></div>${claimSolved?`<div class="note"><strong>${t('caseSolved')}:</strong> ${t('caseText')}</div><p><strong>${t('extra')}:</strong> ${t('extraText')}</p>`:''}${nav(3,claimSolved?5:null,'finish')}</div>`}
if(stage===5){h=`<div class="card"><h2>${t('reportStage')}</h2><p class="status">${t('caseComplete')}</p><p>${t('reportIntro')}</p><h3>${t('reflection')}</h3><label for="reflection">${t('reflectionPrompt')}</label><textarea id="reflection" oninput="updateReport()" placeholder="${t('reflectionPlace')}">${esc(reflection)}</textarea><h3 style="margin-top:22px">${t('reportTitle')}</h3><p class="small">${t('reportHelp')}</p><pre id="reportPreview" class="report"></pre><div class="row"><button class="primary" onclick="copyReport()">${t('copy')}</button><button onclick="downloadReport()">${t('download')}</button></div><p class="statusline" id="reportStatus" aria-live="polite"></p><p class="small">${t('copyHint')}</p>${nav(4,null,'')}<button class="smallbtn" onclick="go(-1)">${t('restart')}</button><p class="small">${t('restartNote')}</p></div>`}
$('content').innerHTML=h;if(stage===4&&guideShape){const selected=document.querySelector('input[name=shape][value='+guideShape+']');if(selected)selected.checked=true}if(stage===3&&predRevealed){$('predictionFeedback').textContent=predictionScore();paintPredictions()}if(stage===5)updateReport()}
function predictionScore(){const answers=predInputs.map(([id,x])=>F[id](x));return `${preds.filter((p,i)=>p!==''&&Number(p)===answers[i]).length} ${t('matched')}`}
function predictionResult(){return predInputs.map(([id,x],i)=>`<p>${t('machine')} ${id}, x=${x}: ${t('predicted')} <strong>${esc(preds[i])}</strong>; ${t('actual')} <strong>${F[id](x)}</strong> ${Number(preds[i])===F[id](x)?'✓':`— ${t('revise')}`}</p>`).join('')}
function paintPredictions(){predInputs.forEach(([id,x],i)=>{const input=$('p'+i),mark=$('mark'+i);if(!input||!mark)return;const correct=String(preds[i]).trim()!==''&&Number(preds[i])===F[id](x);input.classList.toggle('pred-correct',correct);input.classList.toggle('pred-incorrect',!correct);mark.className='pred-mark '+(correct?'good':'bad');mark.textContent=t(correct?'correctGuess':'incorrectGuess')})}
function predictionEdited(i){preds[i]=$('p'+i).value;if(predRevealed){const input=$('p'+i),mark=$('mark'+i);input.classList.remove('pred-correct','pred-incorrect');mark.textContent='';$('predictionFeedback').textContent=t('revisePrompt');$('predictionDetails').innerHTML='';}}
function checkPredictions(){saveInputs();if(preds.some(p=>String(p).trim()==='')){$('predictionFeedback').textContent=t('allFour');return}predRevealed=true;render()}
function checkClaim(){saveInputs();if(!claim){$('claimFeedback').textContent=t('chooseFirst');return}if(reason.trim().length<15){$('claimFeedback').textContent=t('addEvidence');return}if(claim!=='B'){$('claimFeedback').textContent=t('tryAgain');return}claimSolved=true;render()}
function reportText(){const lines=[t('reportHead'),t('language')+': '+(lang==='en'?'English':'Español'),''];for(const id of ['A','B'])lines.push(t(id==='A'?'machineA':'machineB')+': '+[...records[id]].sort((a,b)=>a-b).map(x=>'('+x+', '+F[id](x)+')').join(', '));lines.push('',t('predictions')+':');predInputs.forEach(([id,x],i)=>lines.push(t('machine')+' '+id+', x='+x+': '+(preds[i]||t('notAnswered'))+' ('+t('actual')+': '+F[id](x)+')'));lines.push('',t('suspect')+': '+(claim||t('notSelected')),t('evidence')+': '+(reason||t('notAnswered')),'',t('finalReflection')+': '+(reflection||t('notAnswered')),'');return lines.join('\n')}
function updateReport(){reflection=$('reflection')?.value??reflection;if($('reportPreview'))$('reportPreview').textContent=reportText()}
async function copyReport(){updateReport();const txt=reportText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt)}else{const el=document.createElement('textarea');el.value=txt;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('Copy unavailable');el.remove()}$('reportStatus').textContent=t('copied')}catch(e){$('reportStatus').textContent=t('copyFail');const selection=window.getSelection(),range=document.createRange();range.selectNodeContents($('reportPreview'));selection.removeAllRanges();selection.addRange(range)}}
function downloadReport(){updateReport();const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Pandora_Investigation_Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('reportStatus').textContent=t('saved')}
render();
</script></body></html>
