<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pandora • Pattern Lab — Condensed Strengthen</title><style>
:root{--bg:#101529;--panel:#1c2541;--panel2:#263253;--line:#405071;--ink:#f7f6ff;--muted:#c1c9df;--gold:#ffd277;--violet:#c7a8ff;--mint:#8ce5c6;--pink:#ffafc8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#323063 0,transparent 40%),var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #796ca6;background:#3b3266;color:white;border-radius:12px;padding:11px 16px;font-weight:700}button:hover{background:#52448b}button:disabled{opacity:.45;cursor:default}.primary{background:#7252c5;border-color:#b4a0f3}.primary:hover{background:#8765dd}.wrap{max-width:1040px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{letter-spacing:.17em;text-transform:uppercase;color:var(--gold);font-size:12px;font-weight:800}h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:6px 0}h2{font-size:25px;margin:0 0 8px}h3{margin:0 0 12px}.sub{color:var(--muted);max-width:700px}.pill{background:#302b52;border:1px solid #62578b;border-radius:999px;padding:8px 13px;font-size:13px}.progress{display:flex;gap:7px;margin:24px 0}.dot{height:6px;border-radius:20px;flex:1;background:#333d61}.dot.on{background:var(--gold)}.card{background:rgba(28,37,65,.94);border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 8px 30px #080d2055}.note{border-left:4px solid var(--gold);padding:10px 15px;background:#302e4b;border-radius:6px;margin:12px 0}.machine{background:linear-gradient(140deg,#332f63,#1b3655);border:2px solid #8676b9;border-radius:20px;padding:18px;text-align:center;max-width:520px;margin:16px auto}.machineName{color:var(--gold);font-weight:900;letter-spacing:.13em}.machineBody{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}.value{font-size:30px;font-weight:900;background:#111b35;border:1px solid #6a719c;border-radius:14px;min-width:85px;padding:13px}.arrow{font-size:30px;color:var(--gold)}.mystery{font-size:32px;padding:8px 18px;background:#483b77;border-radius:15px}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.controls input{width:min(310px,70vw);accent-color:var(--gold)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:center}th,td{border:1px solid #576382;padding:8px}th{background:#2d385c;color:var(--gold)}.new{background:#394e69}.graph{width:100%;height:auto;max-height:265px;border-radius:10px;background:#121d36}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{color:var(--mint);font-weight:700}.hidden{display:none!important}.predict{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.prompt{background:#202d4b;border:1px solid #596482;border-radius:12px;padding:14px}.prompt input{background:#10192f;color:white;border:1px solid #8693bd;border-radius:8px;width:100%;padding:10px;margin-top:8px}.feedback{min-height:24px;color:var(--gold);font-weight:700}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare .card{margin:0}.small{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:100px;border-radius:12px;padding:12px;background:#10192f;color:white;border:1px solid #8592b8}fieldset{border:0;padding:0;margin:12px 0}label.choice{display:block;background:#243150;border:1px solid #536282;border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}input[type=radio]{accent-color:var(--gold)}.foot{color:#aab5d1;font-size:12px;padding:25px 0}svg text{font-family:system-ui;fill:#d6dff5;font-size:11px}@media(max-width:690px){.cols,.compare{grid-template-columns:1fr}.card{padding:15px}.wrap{padding:13px}.machineBody{gap:6px}.value{font-size:23px;min-width:65px}}

.langchoices{display:flex;gap:16px;flex-wrap:wrap;margin-top:25px}.langchoices button{min-width:190px;font-size:18px}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.evidence{background:#182540;border:1px solid #647393;border-radius:14px;padding:15px;margin:18px 0}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report{white-space:pre-wrap;overflow-wrap:anywhere;background:#10192f;border:1px solid #647393;border-radius:12px;padding:16px;max-height:370px;overflow:auto;font-size:14px}.statusline{min-height:25px;color:var(--mint);font-weight:700}.sectionlabel{font-weight:800;color:var(--gold);margin:6px 0}.stepintro{color:var(--muted)}.smallbtn{padding:8px 12px}.headnote{font-size:13px;color:var(--muted)}@media(max-width:690px){.evidence-grid{grid-template-columns:1fr}}
.prompt input.pred-correct{border:2px solid #55d6a0;background:#123e35;box-shadow:0 0 0 2px #55d6a033}.prompt input.pred-incorrect{border:2px solid #ff788c;background:#4b2234;box-shadow:0 0 0 2px #ff788c33}.pred-mark{font-weight:800;margin-top:7px;min-height:20px}.pred-mark.good{color:#8ce5c6}.pred-mark.bad{color:#ffb2bf}</style></head><body><main class="wrap">
<div class="top"><div><div class="eyebrow">OPERATION PANDORA / SPOTLIGHT 01</div><h1 id="title">Pattern Lab <span style="color:var(--gold)">✦</span></h1><div class="sub" id="subtitle"></div></div><div class="pill" id="stagePill"></div></div><div class="progress" id="progress"></div>
<section id="content" aria-live="polite"></section><div class="foot" id="footer"></div></main><script>
const words={
en:{subtitle:'Two mysterious machines. One mathematical impostor. Your evidence decides.',stage:'Stage',of:'of',footer:'Pandora Pattern Lab • Prototype v2 • Your work stays in this browser until you close or refresh the page.',choose:'Choose your investigation language',welcome:'Welcome, pattern investigator.',welcomeText:'Two machines follow different secret rules. Send numbers through each one, collect observations, and identify the impostor.',protocol:'Lab protocol',protocolText:'Investigate before guessing. Pay attention to how much the input changes and how much the output changes.',begin:'Enter the lab →',back:'← Back',investigateA:'01 / Investigate Machine A',investigateB:'02 / Investigate Machine B',introA:'Try several inputs. Record each experiment to build your evidence table and graph.',introB:'Collect three or more points, then defend your conclusion.',machine:'MACHINE',input:'Input',output:'Output',record:'Record this input',clear:'Clear observations',table:'Evidence table',graph:'Evidence graph',none:'No observations yet',unique:'unique inputs recorded',noteA:'Try inputs that are not all equally spaced: for example, 0, 1, 3, and 6.',noteB:'Before moving on, compare changes between inputs that are 1 apart and inputs that are 2 apart.',nextB:'Investigate Machine B →',nextPred:'Accept the prediction challenge →',prediction:'03 / Predict before you reveal',predictionIntro:'The output windows are covered. Use the observations you collected to predict the missing outputs. Your evidence tables are right here so you do not have to memorize the patterns.',recordedEvidence:'Your recorded evidence',noEvidence:'You have not recorded any points.',predictionFor:'Predict the output',yourPrediction:'Your prediction',checkPred:'Reveal and check predictions',practice:'Predictions are practice, not grades. You can revise your thinking after seeing the evidence.',allFour:'Enter all four predictions before revealing the results.',matched:'of 4 predictions matched. The important part is revising your reasoning.',predicted:'You predicted',actual:'actual output',revise:'compare and revise your rule',correctGuess:'Correct! ✓',incorrectGuess:'Not yet — revise and check again.',revisePrompt:'Red boxes can be revised. Green boxes are correct. Check again when you are ready.',compare:'Compare the machines →',investigation:'04 / The impostor investigation',investigationIntro:'Both machines are functions: each input produces exactly one output. But only one is linear.',linearInfo:'Linear relationships have a constant rate of change: equal changes in input produce equal changes in output.',impostor:'Which machine is the nonlinear impostor?',reason:'What evidence supports your claim?',reasonPlace:'Use at least two input/output comparisons or explain the graphs.',submit:'Submit my evidence',chooseFirst:'Choose a machine first.',addEvidence:'Add numerical or graphical evidence before submitting.',tryAgain:'Not quite. Compare the y-change from x = 1 to 3 and x = 3 to 5 for both machines. Try again.',solved:'Machine B is the impostor! Review the evidence below.',caseSolved:'Case solved',caseText:'Machine A is linear: output = 3 × input + 2. Machine B is nonlinear: output = input² + 2. Machine A has a constant rate of change; Machine B does not.',extra:'Extra test',extraText:'From input 1 to 3, Machine A rises by 6 and Machine B rises by 8. From input 3 to 5, Machine A rises by 6 again, but Machine B rises by 16. Both input intervals have a length of 2.',finish:'Finish investigation →',reportStage:'05 / Investigator’s report',caseComplete:'Your case is complete. ✦',reportIntro:'You investigated two functions, made predictions, and supported your claim with mathematical evidence.',reflection:'Final reflection',reflectionPrompt:'How could you check whether a table with unevenly spaced x-values represents a linear relationship?',reflectionPlace:'Explain how to compare changes in x and y...',reportTitle:'My investigation report',copy:'Copy Report',download:'Download Report (.txt)',copied:'Report copied! Paste it into your Canvas text-entry submission.',copyFail:'Select and copy the report text below if your browser blocks automatic copying.',saved:'Report downloaded. Upload it to your Canvas assignment if your teacher requests a file.',restart:'Start again',restartNote:'Starting again returns to the language screen but keeps your investigation data. Refreshing the page clears it.',reportHead:'PANDORA PATTERN LAB — INVESTIGATOR REPORT',language:'Language',machineA:'Machine A observations',machineB:'Machine B observations',predictions:'Predictions',suspect:'Impostor selected',evidence:'Evidence',finalReflection:'Final reflection',notSelected:'Not selected',notAnswered:'Not answered',reportHelp:'Your report updates as you write. Copy it into the Canvas text-entry box, or download the text file.',needFour:'Record at least three different inputs to continue.',copyHint:'Canvas text-entry submission is the simplest option when available.'},
es:{subtitle:'Dos máquinas misteriosas. Un impostor matemático. Tus pruebas decidirán.',stage:'Etapa',of:'de',footer:'Laboratorio de patrones de Pandora • Prototipo v2 • Tu trabajo permanece en este navegador hasta que cierres o actualices la página.',choose:'Elige el idioma de tu investigación',welcome:'Bienvenido al laboratorio de patrones.',welcomeText:'Dos máquinas siguen reglas secretas diferentes. Introduce números, recopila observaciones e identifica al impostor.',protocol:'Protocolo del laboratorio',protocolText:'Investiga antes de adivinar. Observa cuánto cambia la entrada y cuánto cambia la salida.',begin:'Entrar al laboratorio →',back:'← Atrás',investigateA:'01 / Investiga la máquina A',investigateB:'02 / Investiga la máquina B',introA:'Prueba varias entradas. Registra cada experimento para construir tu tabla y gráfica.',introB:'Registra tres o más puntos y después defiende tu conclusión.',machine:'MÁQUINA',input:'Entrada',output:'Salida',record:'Registrar esta entrada',clear:'Borrar observaciones',table:'Tabla de observaciones',graph:'Gráfica de observaciones',none:'Todavía no hay observaciones',unique:'entradas diferentes registradas',noteA:'Prueba entradas que no estén igualmente espaciadas: por ejemplo, 0, 1, 3 y 6.',noteB:'Antes de continuar, compara los cambios entre entradas separadas por 1 y entradas separadas por 2.',nextB:'Investigar la máquina B →',nextPred:'Aceptar el desafío de predicción →',prediction:'03 / Predice antes de revelar',predictionIntro:'Las salidas están ocultas. Usa tus observaciones para predecir los valores que faltan. Tus tablas están aquí para que no tengas que memorizar los patrones.',recordedEvidence:'Tus observaciones registradas',noEvidence:'Todavía no has registrado puntos.',predictionFor:'Predice la salida',yourPrediction:'Tu predicción',checkPred:'Revelar y comprobar predicciones',practice:'Las predicciones son práctica, no calificaciones. Puedes revisar tus ideas después de ver las pruebas.',allFour:'Escribe las cuatro predicciones antes de revelar los resultados.',matched:'de 4 predicciones correctas. Lo importante es revisar tu razonamiento.',predicted:'Predijiste',actual:'salida real',revise:'compara y revisa tu regla',correctGuess:'¡Correcto! ✓',incorrectGuess:'Todavía no — revisa y comprueba otra vez.',revisePrompt:'Puedes corregir las casillas rojas. Las verdes son correctas. Comprueba de nuevo cuando estés listo.',compare:'Comparar las máquinas →',investigation:'04 / Investigación del impostor',investigationIntro:'Ambas máquinas son funciones: cada entrada produce exactamente una salida. Pero solo una es lineal.',linearInfo:'Las relaciones lineales tienen una tasa de cambio constante: cambios iguales en la entrada producen cambios iguales en la salida.',impostor:'¿Cuál máquina es el impostor no lineal?',reason:'¿Qué pruebas apoyan tu conclusión?',reasonPlace:'Usa al menos dos comparaciones de entrada y salida o explica las gráficas.',submit:'Presentar mis pruebas',chooseFirst:'Primero elige una máquina.',addEvidence:'Añade pruebas numéricas o gráficas antes de enviar.',tryAgain:'Todavía no. Compara el cambio en y desde x = 1 hasta 3 y desde x = 3 hasta 5 para ambas máquinas. Inténtalo de nuevo.',solved:'¡La máquina B es la impostora! Revisa las pruebas.',caseSolved:'Caso resuelto',caseText:'La máquina A es lineal: salida = 3 × entrada + 2. La máquina B no es lineal: salida = entrada² + 2. La máquina A tiene una tasa de cambio constante; la B no.',extra:'Prueba adicional',extraText:'De la entrada 1 a la 3, la salida de A aumenta 6 y la de B aumenta 8. De la entrada 3 a la 5, A vuelve a aumentar 6, pero B aumenta 16. Ambos intervalos de entrada tienen longitud 2.',finish:'Finalizar investigación →',reportStage:'05 / Informe del investigador',caseComplete:'Caso completado. ✦',reportIntro:'Investigaste dos funciones, hiciste predicciones y defendiste tu conclusión con pruebas matemáticas.',reflection:'Reflexión final',reflectionPrompt:'¿Cómo puedes comprobar si una tabla con valores de x espaciados de forma desigual representa una relación lineal?',reflectionPlace:'Explica cómo comparar los cambios en x y en y...',reportTitle:'Mi informe de investigación',copy:'Copiar informe',download:'Descargar informe (.txt)',copied:'¡Informe copiado! Pégalo en la entrega de texto de Canvas.',copyFail:'Selecciona y copia el texto del informe de abajo si tu navegador bloquea la copia automática.',saved:'Informe descargado. Súbelo a la tarea de Canvas si tu docente solicita un archivo.',restart:'Empezar de nuevo',restartNote:'Volver al inicio conserva tus datos. Actualizar la página los borra.',reportHead:'PANDORA — INFORME DE INVESTIGACIÓN',language:'Idioma',machineA:'Observaciones de la máquina A',machineB:'Observaciones de la máquina B',predictions:'Predicciones',suspect:'Impostor seleccionado',evidence:'Pruebas',finalReflection:'Reflexión final',notSelected:'Sin seleccionar',notAnswered:'Sin responder',reportHelp:'Tu informe se actualiza mientras escribes. Cópialo en la entrega de texto de Canvas o descarga el archivo.',needFour:'Registra al menos tres entradas diferentes para continuar.',copyHint:'La entrega de texto en Canvas es la opción más sencilla cuando está disponible.'}}
const F={A:x=>3*x+2,B:x=>x*x+2},records={A:new Set(),B:new Set()},current={A:0,B:0},predInputs=[['A',4],['B',4],['A',7],['B',7]];
let lang='en',stage=-1,predRevealed=false,claimSolved=false,claim='',reason='',reflection='',preds=['','','',''],feedback='';
const $=id=>document.getElementById(id),t=k=>words[lang][k]||k,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function selectLanguage(l){lang=l;document.documentElement.lang=l;go(1)}
function go(n){saveInputs();stage=n;render();window.scrollTo({top:0,behavior:'instant'})}
function saveInputs(){if(stage===3){preds=preds.map((v,i)=>$('p'+i)?.value??v)}if(stage===4){reason=$('reason')?.value??reason;claim=document.querySelector('input[name=suspect]:checked')?.value||claim}if(stage===5)reflection=$('reflection')?.value??reflection}
function nav(back,next,nextLabel,disabled=false){return `<div class="nav"><button onclick="go(${back})">${t('back')}</button>${next===null?'':`<button class="primary" ${disabled?'disabled':''} onclick="go(${next})">${t(nextLabel)}</button>`}</div>`}
function evidenceTable(id){const xs=[...records[id]].sort((a,b)=>a-b);return `<div class="tablewrap"><table><thead><tr><th>${t('input')} (x)</th><th>${t('output')} (y)</th></tr></thead><tbody>${xs.map(x=>`<tr><td>${x}</td><td>${F[id](x)}</td></tr>`).join('')||`<tr><td colspan="2">${t('none')}</td></tr>`}</tbody></table></div>`}
function graph(id,xs,connect=false){const X=x=>34+x*30,Y=y=>230-y*2.75;let grid='';for(let x=0;x<=8;x+=2)grid+=`<line x1="${X(x)}" y1="20" x2="${X(x)}" y2="230" stroke="#344360"/><text x="${X(x)}" y="247" text-anchor="middle">${x}</text>`;for(let y=0;y<=70;y+=10)grid+=`<line x1="34" y1="${Y(y)}" x2="274" y2="${Y(y)}" stroke="#344360"/><text x="28" y="${Y(y)+4}" text-anchor="end">${y}</text>`;return `<svg class="graph" viewBox="0 0 300 265" role="img" aria-label="${t('graph')} ${id}"><line x1="34" y1="20" x2="34" y2="230" stroke="#9cacc9"/><line x1="34" y1="230" x2="280" y2="230" stroke="#9cacc9"/>${grid}${connect?`<polyline points="${xs.map(x=>`${X(x)},${Y(F[id](x))}`).join(' ')}" fill="none" stroke="#ffd277" stroke-width="3"/>`:''}${xs.map(x=>`<circle cx="${X(x)}" cy="${Y(F[id](x))}" r="5" fill="#8ce5c6" stroke="#162039" stroke-width="2"/>`).join('')}<text x="282" y="244">x</text><text x="12" y="16">y</text></svg>`}
function machine(id){return `<div class="machine"><div class="machineName">${t('machine')} ${id}</div><div class="machineBody"><div class="value" id="input${id}">${current[id]}</div><div class="arrow">➜</div><div class="mystery">⚙️ ?</div><div class="arrow">➜</div><div class="value" id="output${id}">${F[id](current[id])}</div></div><div class="controls"><span>${t('input')}</span><input aria-label="${t('machine')} ${id} ${t('input')}" type="range" min="0" max="8" step="1" value="${current[id]}" oninput="move('${id}',+this.value)"><span id="range${id}">${current[id]}</span></div></div>`}
function move(id,x){current[id]=x;$('input'+id).textContent=x;$('output'+id).textContent=F[id](x);$('range'+id).textContent=x}
function record(id){records[id].add(current[id]);render()}
function resetMachine(id){records[id].clear();render()}
function render(){document.documentElement.lang=lang;$('subtitle').textContent=t('subtitle');$('stagePill').textContent=stage<0?'EN / ES':`${t('stage')} ${stage===1?1:stage===2?2:stage===4?3:4} ${t('of')} 4`;$('footer').textContent=t('footer');$('progress').innerHTML=Array.from({length:4},(_,i)=>`<div class="dot ${(stage===1?1:stage===2?2:stage===4?3:4)>i?'on':''}"></div>`).join('');let h='';
if(stage===-1)h=`<div class="card"><h2>${t('choose')}</h2><p>Choose English or Español. / Elige inglés o español.</p><div class="langchoices"><button class="primary" onclick="selectLanguage('en')">English →</button><button class="primary" onclick="selectLanguage('es')">Español →</button></div></div>`;
if(stage===0)h=`<div class="card"><h2>${t('welcome')}</h2><p>${t('welcomeText')}</p><div class="note"><strong>${t('protocol')}:</strong> ${t('protocolText')}</div><div class="nav"><button onclick="go(-1)">${t('back')}</button><button class="primary" onclick="go(1)">${t('begin')}</button></div></div>`;
if(stage===1||stage===2){const id=stage===1?'A':'B';const xs=[...records[id]].sort((a,b)=>a-b);h=`<div class="card"><h2>${t(stage===1?'investigateA':'investigateB')}</h2><p class="sub">${t(stage===1?'introA':'introB')}</p>${machine(id)}<div class="row"><button onclick="record('${id}')">${t('record')}</button><button onclick="resetMachine('${id}')">${t('clear')}</button><span class="status">${xs.length} ${t('unique')}</span></div><div class="cols"><div><h3>${t('table')}</h3>${evidenceTable(id)}</div><div><h3>${t('graph')}</h3>${graph(id,xs)}</div></div><div class="note">${t(stage===1?'noteA':'noteB')}</div>${xs.length<3?`<p class="headnote">${t('needFour')}</p>`:''}${nav(stage-1,stage===1?2:4,stage===1?'nextB':'nextPred',xs.length<3)}</div>`}
if(stage===3){h=`<div class="card"><h2>${t('prediction')}</h2><p>${t('predictionIntro')}</p><div class="evidence"><h3>${t('recordedEvidence')}</h3><div class="evidence-grid">${['A','B'].map(id=>`<div><div class="sectionlabel">${t('machine')} ${id}</div>${evidenceTable(id)}</div>`).join('')}</div></div><div class="predict">${predInputs.map(([id,x],i)=>`<div class="prompt"><strong>${t('machine')} ${id}</strong><div>${t('input')}: ${x} → ${t('output')}: ?</div><label for="p${i}" class="small">${t('yourPrediction')}</label><input id="p${i}" type="number" value="${esc(preds[i])}" placeholder="${t('yourPrediction')}" aria-label="${t('machine')} ${id} ${t('input')} ${x}" oninput="predictionEdited(${i})"><div class="pred-mark" id="mark${i}" aria-live="polite"></div></div>`).join('')}</div><p class="small">${t('practice')}</p><button onclick="checkPredictions()">${t('checkPred')}</button><div class="feedback" id="predictionFeedback" aria-live="polite"></div><div id="predictionDetails">${predRevealed?`<p class="small">${t('revisePrompt')}</p>`+predictionResult():''}</div>${nav(2,predRevealed?4:null,'compare')}</div>`}
if(stage===4){h=`<div class="card"><h2>${t('investigation')}</h2><p>${t('investigationIntro')}</p><p>${t('linearInfo')}</p><div class="compare">${['A','B'].map(id=>`<div class="card"><h3>${t('machine')} ${id}</h3><div class="tablewrap"><table><thead><tr><th>x</th>${[0,1,3,5].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><th>y</th>${[0,1,3,5].map(x=>`<td>${F[id](x)}</td>`).join('')}</tr></tbody></table></div>${graph(id,Array.from({length:9},(_,i)=>i),true)}</div>`).join('')}</div><div class="note">${lang==='es'?'Reto: explica cómo se comparan los cambios de y para intervalos iguales de x. Usa al menos dos intervalos y menciona la forma de la gráfica.':'Challenge: compare changes in y over equal intervals of x. Use at least two intervals and describe the graph shape.'}</div><fieldset><legend><strong>${t('impostor')}</strong></legend>${['A','B'].map(id=>`<label class="choice"><input type="radio" name="suspect" value="${id}" ${claim===id?'checked':''}> ${t('machine')} ${id}</label>`).join('')}</fieldset><label for="reason"><strong>${t('reason')}</strong></label><textarea id="reason" placeholder="${t('reasonPlace')}">${esc(reason)}</textarea><div class="row"><button onclick="checkClaim()">${t('submit')}</button><span id="claimFeedback" class="feedback" aria-live="polite">${claimSolved?t('solved'):''}</span></div>${claimSolved?`<div class="note"><strong>${t('caseSolved')}:</strong> ${t('caseText')}</div><p><strong>${t('extra')}:</strong> ${t('extraText')}</p>`:''}${nav(2,claimSolved?5:null,'finish')}</div>`}
if(stage===5){h=`<div class="card"><h2>${t('reportStage')}</h2><p class="status">${t('caseComplete')}</p><p>${t('reportIntro')}</p><h3>${t('reflection')}</h3><label for="reflection">${t('reflectionPrompt')}</label><textarea id="reflection" oninput="updateReport()" placeholder="${t('reflectionPlace')}">${esc(reflection)}</textarea><h3 style="margin-top:22px">${t('reportTitle')}</h3><p class="small">${t('reportHelp')}</p><pre id="reportPreview" class="report"></pre><div class="row"><button class="primary" onclick="copyReport()">${t('copy')}</button><button onclick="downloadReport()">${t('download')}</button></div><p class="statusline" id="reportStatus" aria-live="polite"></p><p class="small">${t('copyHint')}</p>${nav(4,null,'')}<button class="smallbtn" onclick="go(-1)">${t('restart')}</button><p class="small">${t('restartNote')}</p></div>`}
$('content').innerHTML=h;if(stage===3&&predRevealed){$('predictionFeedback').textContent=predictionScore();paintPredictions()}if(stage===5)updateReport()}
function predictionScore(){const answers=predInputs.map(([id,x])=>F[id](x));return `${preds.filter((p,i)=>p!==''&&Number(p)===answers[i]).length} ${t('matched')}`}
function predictionResult(){return predInputs.map(([id,x],i)=>`<p>${t('machine')} ${id}, x=${x}: ${t('predicted')} <strong>${esc(preds[i])}</strong>; ${t('actual')} <strong>${F[id](x)}</strong> ${Number(preds[i])===F[id](x)?'✓':`— ${t('revise')}`}</p>`).join('')}
function paintPredictions(){predInputs.forEach(([id,x],i)=>{const input=$('p'+i),mark=$('mark'+i);if(!input||!mark)return;const correct=String(preds[i]).trim()!==''&&Number(preds[i])===F[id](x);input.classList.toggle('pred-correct',correct);input.classList.toggle('pred-incorrect',!correct);mark.className='pred-mark '+(correct?'good':'bad');mark.textContent=t(correct?'correctGuess':'incorrectGuess')})}
function predictionEdited(i){preds[i]=$('p'+i).value;if(predRevealed){const input=$('p'+i),mark=$('mark'+i);input.classList.remove('pred-correct','pred-incorrect');mark.textContent='';$('predictionFeedback').textContent=t('revisePrompt');$('predictionDetails').innerHTML='';}}
function checkPredictions(){saveInputs();if(preds.some(p=>String(p).trim()==='')){$('predictionFeedback').textContent=t('allFour');return}predRevealed=true;render()}
function checkClaim(){saveInputs();if(!claim){$('claimFeedback').textContent=t('chooseFirst');return}if(reason.length<15){$('claimFeedback').textContent=t('addEvidence');return}if(claim!=='B'){$('claimFeedback').textContent=t('tryAgain');return}claimSolved=true;render()}
function reportText(){const lines=[t('reportHead'),t('language')+': '+(lang==='en'?'English':'Español'),''];for(const id of ['A','B'])lines.push(t(id==='A'?'machineA':'machineB')+': '+[...records[id]].sort((a,b)=>a-b).map(x=>'('+x+', '+F[id](x)+')').join(', '));lines.push('',t('suspect')+': '+(claim||t('notSelected')),t('evidence')+': '+(reason||t('notAnswered')),'',t('finalReflection')+': '+(reflection||t('notAnswered')),'');return lines.join('\n')}
function updateReport(){reflection=$('reflection')?.value??reflection;if($('reportPreview'))$('reportPreview').textContent=reportText()}
async function copyReport(){updateReport();const txt=reportText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt)}else{const el=document.createElement('textarea');el.value=txt;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('Copy unavailable');el.remove()}$('reportStatus').textContent=t('copied')}catch(e){$('reportStatus').textContent=t('copyFail');const selection=window.getSelection(),range=document.createRange();range.selectNodeContents($('reportPreview'));selection.removeAllRanges();selection.addRange(range)}}
function downloadReport(){updateReport();const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Pandora_Investigation_Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('reportStatus').textContent=t('saved')}
render();
</script></body></html>
