<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pandora | Impostor Factory — Extend</title><style>
:root{--bg:#101529;--panel:#1c2541;--edge:#536182;--gold:#ffd277;--mint:#91ebca;--ink:#f7f6ff;--muted:#c1c9df;--violet:#ad91f3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#34316c,#101529 55%);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:24px}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:4px 0}h2{margin-top:0;font-size:26px}h3{color:var(--gold)}p{margin:10px 0}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:800}.card{background:#1c2541f0;border:1px solid var(--edge);border-radius:20px;padding:23px;margin:18px 0}.note{background:#30304f;border-left:4px solid var(--gold);padding:12px;border-radius:7px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:#24314f;border:1px solid #647293;border-radius:14px;padding:15px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}button,select{font:inherit}button{background:#453777;border:1px solid #a492e2;color:white;border-radius:11px;padding:11px 16px;font-weight:750;cursor:pointer}button:hover{background:#63509e}button.primary{background:#7252c5}button:disabled{opacity:.45;cursor:not-allowed}select,input,textarea{background:#111b35;color:white;border:1px solid #91a0c4;border-radius:9px;padding:9px;font:inherit}textarea{width:100%;min-height:100px;resize:vertical}label{display:block;margin:10px 0;font-weight:650}label textarea,label select{display:block;margin-top:7px}table{width:100%;border-collapse:collapse;text-align:center}td,th{border:1px solid #5e6b8c;padding:8px}th{background:#303c60;color:var(--gold)}svg{max-width:100%;height:auto;background:#111b35;border-radius:10px}.progress{display:flex;gap:6px;margin-top:22px}.progress span{height:7px;flex:1;background:#394363;border-radius:5px}.progress .on{background:var(--gold)}.pill{border:1px solid #8579b5;border-radius:99px;padding:7px 13px;color:var(--gold)}.feedback{color:var(--mint);font-weight:700;min-height:25px}.warn{color:#ffb4bd}.report{white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto;background:#111b35;border:1px solid #5e6b8c;padding:15px;border-radius:12px}.chip{display:inline-block;border-radius:30px;background:#3b3266;padding:6px 12px;margin:4px}.hidden{display:none!important}@media(max-width:690px){main{padding:13px}.card{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main><header><div class="eyebrow">OPERATION PANDORA / EXTEND • SPOTLIGHT</div><div class="row" style="justify-content:space-between"><h1>THE IMPOSTOR FACTORY <span style="color:var(--gold)">✦</span></h1><span class="pill" id="counter"></span></div><p class="muted" id="subtitle"></p><div class="progress" id="progress"></div></header><section id="app" aria-live="polite"></section><p class="muted" style="font-size:12px">Pandora • Your work is kept in this page while it remains open. Copy or download your report before leaving.</p></main><script>
const T={en:{subtitle:'Two matching clues. One dangerous assumption. Build a pattern that can fool an investigator.',choose:'Choose your investigation language',start:'Enter the factory →',back:'← Back',next:'Continue →',stage:'Stage',welcome:'Your promotion: Chief Impostor Engineer',welcomeP:'You already know how to distinguish linear and nonlinear patterns. Now investigate why a convincing-looking pattern can still be misleading.',mission:'Mission',missionP:'Expose an impostor, engineer one of your own, and defend your reasoning with mathematical evidence.',clue:'Challenge 1 / The convincing evidence',clueP:'The machines have been tested only at x = 1 and x = 2. Examine the evidence. Is that enough to decide that both machines are linear?',machine:'Machine',input:'Input',output:'Output',both:'Both machines produced the same outputs for the first two inputs.',verdict:'Based only on these two inputs, what can you conclude?',v1:'Both machines must be linear.',v2:'Neither machine can be linear.',v3:'There is not enough evidence to classify both machines.',test:'Choose another input to test',run:'Run test',more:'Collect at least two additional tests before proceeding.',tests:'Additional test results',unlock:'Open the full evidence →',compare:'Challenge 2 / Expose the impostor',compareP:'Now the rules and graphs are revealed. Identify the impostor and use evidence from more than two points.',rule:'Rule',which:'Which machine is nonlinear?',evidence:'Explain using both the graph and changes in the table.',check:'Check reasoning',need:'Choose the correct machine and write at least 25 characters of evidence.',incorrect:'Review which graph bends and which has a constant output change for a +1 input change.',good:'Investigation verified. You may enter the factory.',factory:'Challenge 3 / Build an impostor',factoryP:'Design a nonlinear machine that agrees with the linear reference at x = 1 and x = 2, but differs elsewhere. Choose a hidden modification and test it.',reference:'Reference machine',design:'Your impostor design',coefficient:'Choose the disguise strength',trial:'Compare the machines at a test input',explain:'Why does your machine fool someone who tests only x = 1 and x = 2?',proof:'Use a different input to show your machine is not the reference line.',factoryCheck:'Validate my design',factoryGood:'Your impostor is valid: it matches at the two chosen inputs but is not linear.',factoryNeed:'Explain the trick and test a point other than x = 1 or x = 2.',defense:'Challenge 4 / Defend your case',defenseP:'Make a mathematical argument that distinguishes what your evidence proves from what it does not prove.',q1:'What can two points tell us about a relationship? What can they NOT guarantee?',q2:'Explain how you could verify linearity using a table with evenly spaced inputs.',q3:'Explain how the graph supports or challenges your conclusion.',finish:'Create investigator report →',report:'Investigator report',reportP:'Review your evidence, then copy or download it for your Canvas submission.',copy:'Copy Report',download:'Download Report (.txt)',copied:'Copied! Paste your report into Canvas.',copyFail:'Copy was blocked. Select the report text and copy it manually.',downloaded:'Report downloaded.',needDefense:'Complete all three defense responses before generating your report.',restart:'Change language / restart',status:'Progress saved while this tab remains open.',testHint:'Try inputs outside the original pair to look for a disagreement.',factoryHint:'The disguise is built so that its extra term becomes zero at x = 1 and x = 2.',table:'Evidence table',graph:'Graph'},es:{subtitle:'Dos pistas que coinciden. Una suposición peligrosa. Construye un patrón que engañe a un investigador.',choose:'Elige el idioma de investigación',start:'Entrar a la fábrica →',back:'← Atrás',next:'Continuar →',stage:'Etapa',welcome:'Tu ascenso: Ingeniero/a jefe de impostores',welcomeP:'Ya sabes distinguir patrones lineales y no lineales. Ahora investiga por qué un patrón convincente puede ser engañoso.',mission:'Misión',missionP:'Descubre un impostor, diseña uno y defiende tu razonamiento con evidencia matemática.',clue:'Desafío 1 / Evidencia convincente',clueP:'Las máquinas solo se probaron con x = 1 y x = 2. ¿Es suficiente para decidir que ambas son lineales?',machine:'Máquina',input:'Entrada',output:'Salida',both:'Ambas máquinas dieron las mismas salidas para las primeras dos entradas.',verdict:'Basándote solo en estas dos entradas, ¿qué puedes concluir?',v1:'Ambas máquinas tienen que ser lineales.',v2:'Ninguna máquina puede ser lineal.',v3:'No hay suficiente evidencia para clasificar ambas máquinas.',test:'Elige otra entrada para probar',run:'Probar',more:'Realiza al menos dos pruebas adicionales para continuar.',tests:'Resultados de pruebas adicionales',unlock:'Abrir toda la evidencia →',compare:'Desafío 2 / Descubre al impostor',compareP:'Ahora se revelan las reglas y las gráficas. Identifica al impostor usando más de dos puntos.',rule:'Regla',which:'¿Qué máquina es no lineal?',evidence:'Explica usando la gráfica y los cambios en la tabla.',check:'Comprobar razonamiento',need:'Elige la máquina correcta y escribe al menos 25 caracteres de evidencia.',incorrect:'Observa qué gráfica se curva y cuál mantiene un cambio constante en la salida cuando la entrada aumenta 1.',good:'Investigación verificada. Puedes entrar a la fábrica.',factory:'Desafío 3 / Construye un impostor',factoryP:'Diseña una máquina no lineal que coincida con la referencia lineal en x = 1 y x = 2, pero que sea diferente en otros puntos.',reference:'Máquina de referencia',design:'Tu diseño de impostor',coefficient:'Elige la intensidad del disfraz',trial:'Compara las máquinas en otra entrada',explain:'¿Por qué tu máquina engañaría a alguien que solo prueba x = 1 y x = 2?',proof:'Usa otra entrada para demostrar que tu máquina no es la recta de referencia.',factoryCheck:'Validar mi diseño',factoryGood:'Tu impostor es válido: coincide en dos entradas, pero no es lineal.',factoryNeed:'Explica el truco y prueba un valor distinto de x = 1 o x = 2.',defense:'Desafío 4 / Defiende tu caso',defenseP:'Construye un argumento que distinga lo que demuestra tu evidencia de lo que no demuestra.',q1:'¿Qué pueden decirnos dos puntos de una relación? ¿Qué NO pueden garantizar?',q2:'¿Cómo verificarías la linealidad con una tabla de entradas igualmente espaciadas?',q3:'¿Cómo apoya o contradice la gráfica tu conclusión?',finish:'Crear informe →',report:'Informe del investigador',reportP:'Revisa la evidencia y copia o descarga el informe para entregarlo en Canvas.',copy:'Copiar informe',download:'Descargar informe (.txt)',copied:'¡Copiado! Pega el informe en Canvas.',copyFail:'No se pudo copiar. Selecciona el texto del informe y cópialo manualmente.',downloaded:'Informe descargado.',needDefense:'Completa las tres respuestas antes de generar el informe.',restart:'Cambiar idioma / reiniciar',status:'El progreso se conserva mientras esta pestaña esté abierta.',testHint:'Prueba entradas fuera del par original para encontrar diferencias.',factoryHint:'El disfraz está diseñado para que el término adicional valga cero cuando x = 1 o x = 2.',table:'Tabla de evidencia',graph:'Gráfica'}};
let lang='en',stage=-1,verdict='',tests=[],suspect='',evidence='',k=1,trial=0,explain='',defense=['','',''],verified=false,factoryVerified=false;const $=id=>document.getElementById(id),t=k=>T[lang][k],A=x=>2*x+1,B=x=>x*x-x+3,C=x=>A(x)+k*(x-1)*(x-2);function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(prev,next,label){return `<div class="nav"><button onclick="go(${prev})">${t('back')}</button>${next===null?'':`<button class="primary" onclick="go(${next})">${label||t('next')}</button>`}</div>`}function go(n){save();stage=n;render();window.scrollTo({top:0,behavior:'instant'})}function save(){if($('evidence'))evidence=$('evidence').value;if($('explain'))explain=$('explain').value;for(let i=0;i<3;i++)if($('d'+i))defense[i]=$('d'+i).value;if($('suspect'))suspect=$('suspect').value;if($('verdict'))verdict=$('verdict').value}function choose(l){lang=l;go(0)}function pointsTable(f,xs){return `<table><thead><tr><th>x</th>${xs.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><th>y</th>${xs.map(x=>`<td>${f(x)}</td>`).join('')}</tr></tbody></table>`}function graph(f){let p=[];for(let x=-1;x<=4.01;x+=.125)p.push([x,f(x)]);let X=x=>35+(x+1)*49,Y=y=>222-(y+1)*15;let grid='';for(let x=-1;x<=4;x++)grid+=`<line x1="${X(x)}" y1="12" x2="${X(x)}" y2="235" stroke="#36415c"/><text x="${X(x)}" y="251" fill="#d5def4" text-anchor="middle" font-size="11">${x}</text>`;for(let y=0;y<=12;y+=2)grid+=`<line x1="30" y1="${Y(y)}" x2="285" y2="${Y(y)}" stroke="#36415c"/><text x="22" y="${Y(y)+4}" fill="#d5def4" text-anchor="end" font-size="11">${y}</text>`;return `<svg viewBox="0 0 310 265" role="img" aria-label="${t('graph')}"><rect width="310" height="265" fill="#111b35"/>${grid}<polyline points="${p.map(([x,y])=>`${X(x)},${Y(y)}`).join(' ')}" fill="none" stroke="#ffd277" stroke-width="3"/>${[0,1,2,3,4].map(x=>`<circle cx="${X(x)}" cy="${Y(f(x))}" r="4" fill="#91ebca"/>`).join('')}</svg>`}function option(value,label){return `<option value="${value}" ${verdict===value?'selected':''}>${label}</option>`}function render(){document.documentElement.lang=lang;$('subtitle').textContent=t('subtitle');$('counter').textContent=stage<0?'EN / ES':`${t('stage')} ${Math.max(1,stage)} / 5`;$('progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${stage>i?'on':''}"></span>`).join('');let h='';if(stage===-1)h=`<div class="card"><h2>${t('choose')}</h2><div class="row"><button onclick="choose('en')">English →</button><button onclick="choose('es')">Español →</button></div></div>`;if(stage===0)h=`<div class="card"><h2>${t('welcome')}</h2><p>${t('welcomeP')}</p><div class="note"><strong>${t('mission')}:</strong> ${t('missionP')}</div>${nav(-1,1,t('start'))}</div>`;if(stage===1)h=`<div class="card"><h2>${t('clue')}</h2><p>${t('clueP')}</p><div class="grid">${['A','B'].map(id=>`<div class="panel"><h3>${t('machine')} ${id}</h3>${pointsTable(id==='A'?A:B,[1,2])}</div>`).join('')}</div><p class="note">${t('both')}</p><label>${t('verdict')}<select id="verdict" onchange="verdict=this.value;render()"><option value="">—</option>${option('must',t('v1'))}${option('neither',t('v2'))}${option('uncertain',t('v3'))}</select></label><p class="muted">${t('testHint')}</p><div class="row"><label>${t('test')} <select id="testX">${[-1,0,3,4,5].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label><button onclick="addTest()">${t('run')}</button></div><h3>${t('tests')}</h3>${tests.length?`<table><tr><th>x</th><th>A</th><th>B</th></tr>${tests.map(x=>`<tr><td>${x}</td><td>${A(x)}</td><td>${B(x)}</td></tr>`).join('')}</table>`:`<p class="muted">${t('more')}</p>`}<p id="clueFeedback" class="feedback"></p>${nav(0,tests.length>=2&&verdict==='uncertain'?2:null,t('unlock'))}</div>`;if(stage===2)h=`<div class="card"><h2>${t('compare')}</h2><p>${t('compareP')}</p><div class="grid">${['A','B'].map(id=>`<div class="panel"><h3>${t('machine')} ${id}</h3><p>${t('rule')}: <strong>${id==='A'?'y = 2x + 1':'y = x² − x + 3'}</strong></p>${pointsTable(id==='A'?A:B,[0,1,2,3,4])}${graph(id==='A'?A:B)}</div>`).join('')}</div><label>${t('which')}<select id="suspect" onchange="suspect=this.value"><option value="">—</option><option value="A" ${suspect==='A'?'selected':''}>${t('machine')} A</option><option value="B" ${suspect==='B'?'selected':''}>${t('machine')} B</option></select></label><label>${t('evidence')}<textarea id="evidence">${escapeHTML(evidence)}</textarea></label><button onclick="verify()">${t('check')}</button><p id="verifyFeedback" class="feedback">${verified?t('good'):''}</p>${nav(1,verified?3:null)}</div>`;if(stage===3)h=`<div class="card"><h2>${t('factory')}</h2><p>${t('factoryP')}</p><div class="grid"><div class="panel"><h3>${t('reference')}</h3><p><strong>y = 2x + 1</strong></p>${pointsTable(A,[0,1,2,3])}${graph(A)}</div><div class="panel"><h3>${t('design')}</h3><p><strong>y = 2x + 1 + <span id="kText">${k}</span>(x − 1)(x − 2)</strong></p><label>${t('coefficient')} <select id="k" onchange="setK(this.value)">${[-2,-1,1,2].map(n=>`<option value="${n}" ${n===k?'selected':''}>${n}</option>`).join('')}</select></label><div id="designTable">${pointsTable(C,[0,1,2,3])}</div><div id="designGraph">${graph(C)}</div></div></div><div class="row"><label>${t('trial')} <select id="trial" onchange="trial=+this.value;updateTrial()">${[0,1,2,3,4].map(n=>`<option value="${n}" ${n===trial?'selected':''}>x = ${n}</option>`).join('')}</select></label><span class="chip" id="trialResult"></span></div><p class="muted">${t('factoryHint')}</p><label>${t('explain')}<textarea id="explain">${escapeHTML(explain)}</textarea></label><label><input id="proofCheck" type="checkbox" ${factoryVerified?'checked':''}> ${t('proof')}</label><button onclick="verifyFactory()">${t('factoryCheck')}</button><p id="factoryFeedback" class="feedback">${factoryVerified?t('factoryGood'):''}</p>${nav(2,factoryVerified?4:null)}</div>`;if(stage===4)h=`<div class="card"><h2>${t('defense')}</h2><p>${t('defenseP')}</p>${[t('q1'),t('q2'),t('q3')].map((q,i)=>`<label>${q}<textarea id="d${i}" oninput="defense[${i}]=this.value">${escapeHTML(defense[i])}</textarea></label>`).join('')}<p id="defenseFeedback" class="feedback"></p><div class="nav"><button onclick="go(3)">${t('back')}</button><button class="primary" onclick="finish()">${t('finish')}</button></div></div>`;if(stage===5)h=`<div class="card"><h2>${t('report')}</h2><p>${t('reportP')}</p><pre id="reportText" class="report"></pre><div class="row"><button class="primary" onclick="copyReport()">${t('copy')}</button><button onclick="downloadReport()">${t('download')}</button></div><p id="reportFeedback" class="feedback"></p>${nav(4,null)}<button onclick="restart()">${t('restart')}</button></div>`;$('app').innerHTML=h;if(stage===3)updateTrial();if(stage===5)$('reportText').textContent=makeReport()}
function addTest(){save();const x=+$('testX').value;if(!tests.includes(x))tests.push(x);render()}function verify(){save();const out=$('verifyFeedback');if(suspect!=='B'){out.className='feedback warn';out.textContent=t('incorrect');return}if(evidence.trim().length<25){out.className='feedback warn';out.textContent=t('need');return}verified=true;render()}function setK(v){save();k=+v;factoryVerified=false;render()}function updateTrial(){if(!$('trialResult'))return;$('trialResult').textContent=`x=${trial}: ${t('reference')} ${A(trial)} | ${t('design')} ${C(trial)}`}function verifyFactory(){save();if(trial===1||trial===2||explain.trim().length<25||!$('proofCheck').checked){$('factoryFeedback').className='feedback warn';$('factoryFeedback').textContent=t('factoryNeed');return}factoryVerified=true;render()}function finish(){save();if(defense.some(s=>s.trim().length<20)){$('defenseFeedback').className='feedback warn';$('defenseFeedback').textContent=t('needDefense');return}go(5)}function makeReport(){return ['PANDORA — IMPOSTOR FACTORY / EXTEND',`Language / Idioma: ${lang}`,'',`Initial conclusion: ${verdict}`,`Additional tests: ${tests.map(x=>`x=${x}: A=${A(x)}, B=${B(x)}`).join('; ')}`,'',`Identified impostor: Machine ${suspect}`,`Evidence: ${evidence}`,'',`Created rule: y = 2x + 1 + ${k}(x − 1)(x − 2)`,`Comparison at x=${trial}: reference=${A(trial)}, impostor=${C(trial)}`,`Design explanation: ${explain}`,'',`1. ${t('q1')}\n${defense[0]}`,`2. ${t('q2')}\n${defense[1]}`,`3. ${t('q3')}\n${defense[2]}`].join('\n')}async function copyReport(){const txt=makeReport();try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(txt);else{let e=document.createElement('textarea');e.value=txt;document.body.appendChild(e);e.select();if(!document.execCommand('copy'))throw Error('copy');e.remove()}$('reportFeedback').textContent=t('copied')}catch(e){$('reportFeedback').textContent=t('copyFail');let range=document.createRange();range.selectNodeContents($('reportText'));let sel=window.getSelection();sel.removeAllRanges();sel.addRange(range)}}function downloadReport(){const blob=new Blob([makeReport()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Pandora_Impostor_Factory_Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('reportFeedback').textContent=t('downloaded')}function restart(){if(confirm(lang==='en'?'Restart and clear your work?':'¿Reiniciar y borrar tu trabajo?'))location.reload()}render();
</script></body></html>
